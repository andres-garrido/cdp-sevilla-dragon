    <script>
        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAAsDclwVgwj2Q2fgDGlgksEVjOz0G74SY",
            authDomain: "cdp-sevilla-dragon.firebaseapp.com",

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Sistema de almacenamiento con Firebase
        const DB = {
            // Caché local para mejorar rendimiento
            cache: {},
            
            // Obtener datos (síncrono desde caché)
            get: (key) => {
                if (DB.cache[key]) {
                    return DB.cache[key].data;
                }
                return null;
            },
            
            // Guardar datos (asíncrono a Firebase, inmediato en caché)
            set: (key, value) => {
                // Actualizar caché inmediatamente
                DB.cache[key] = { data: value, timestamp: Date.now() };
                
                // Guardar en Firebase en segundo plano
                db.collection('data').doc(key).set({
                    value: value,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(e => {
                    console.error('Error guardando en Firebase:', e);
                });
            },
            
            // Inicializar caché cargando todos los datos
            initCache: async () => {
                try {
                    const snapshot = await db.collection('data').get();
                    snapshot.forEach(doc => {
                        DB.cache[doc.id] = {
                            data: doc.data().value,
                            timestamp: Date.now()
                        };
                    });
                } catch (e) {
                    console.error('Error inicializando caché:', e);
                }
            }
        };

        // Función para normalizar fechas DD/MM/AA a DD/MM/AAAA
        function normalizarFecha(fecha) {
            if (!fecha) return fecha;
            
            // Convertir a string por si viene como número de Excel
            fecha = String(fecha).trim();
            
            // Si viene vacía
            if (fecha === '' || fecha === 'undefined' || fecha === 'null') return '';
            
            // Formato DD/MM/AAAA (ya correcto)
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(fecha)) {
                return fecha;
            }
            
            // Formato DD/MM/AA (convertir a AAAA)
            if (/^\d{2}\/\d{2}\/\d{2}$/.test(fecha)) {
                const partes = fecha.split('/');
                let año = parseInt(partes[2]);
                año = año >= 50 ? 1900 + año : 2000 + año;
                return `${partes[0]}/${partes[1]}/${año}`;
            }
            
            // Intentar parsear fechas en otros formatos comunes de Excel
            // Formato: DD-MM-YYYY o DD-MM-YY
            if (/^\d{2}-\d{2}-\d{2,4}$/.test(fecha)) {
                const partes = fecha.split('-');
                if (partes[2].length === 2) {
                    let año = parseInt(partes[2]);
                    año = año >= 50 ? 1900 + año : 2000 + año;
                    return `${partes[0]}/${partes[1]}/${año}`;
                } else {
                    return `${partes[0]}/${partes[1]}/${partes[2]}`;
                }
            }
            
            // Formato ISO: YYYY-MM-DD
            if (/^\d{4}-\d{2}-\d{2}$/.test(fecha)) {
                const partes = fecha.split('-');
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            
            console.log('Formato de fecha no reconocido:', fecha);
            return fecha;
        }


        // Función para calcular edad de participante
        function calcularEdadParticipante(fechaNac) {
            if (!fechaNac) return 0;
            const partes = fechaNac.split('/');
            if (partes.length !== 3) return 0;
            const hoy = new Date();
            const nac = new Date(partes[2], partes[1] - 1, partes[0]);
            let edad = hoy.getFullYear() - nac.getFullYear();
            const m = hoy.getMonth() - nac.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
            return edad;
        }

        
        // Inicializar datos
        async function initData() {
            // Inicializar caché desde Firebase
            await DB.initCache();
            
            let users = DB.get('users');
            if (!users || users.length === 0) {
                const defaultUsers = [
                    {id: 1, username: 'admin', password: 'admin123', role: 'admin', nombre: 'Administrador'},
                    {id: 2, username: 'timonel', password: 'timonel123', role: 'timonel', nombre: 'Juan Pérez', telefono: ''}
                ];
                users = defaultUsers;
                DB.set('users', defaultUsers);
            }
            
            if (!DB.get('auxiliares')) DB.set('auxiliares', []);
            if (!DB.get('zodiac')) DB.set('zodiac', []);
            if (!DB.get('barcos')) DB.set('barcos', []);
            if (!DB.get('sesiones')) DB.set('sesiones', []);
            if (!DB.get('asistencias')) DB.set('asistencias', []);
            if (!DB.get('satisfaccion')) DB.set('satisfaccion', []);
            if (!DB.get('incidencias')) DB.set('incidencias', []);
            
            // MIGRACIÓN ROBUSTA: Sincronizar TODOS los auxiliares y zodiac con la tabla users
            const auxiliares = DB.get('auxiliares') || [];
            const zodiac = DB.get('zodiac') || [];
            let usersCambiados = false;
            let auxiliaresCambiados = false;
            let zodiacCambiados = false;
            
            // Sincronizar auxiliares
            auxiliares.forEach((aux, index) => {
                const existeEnUsers = users.some(u => u.id === aux.id);
                
                if (!existeEnUsers) {
                    // Si no tiene username/password, generarlos automáticamente
                    if (!aux.username || !aux.password) {
                        const nombreSimple = aux.nombre.toLowerCase().replace(/\s+/g, '');
                        auxiliares[index].username = `aux_${nombreSimple}`;
                        auxiliares[index].password = `aux123`;
                        auxiliares[index].role = 'auxiliar';
                        auxiliaresCambiados = true;
                    }
                    
                    // Añadir a users
                    users.push({
                        id: aux.id,
                        nombre: aux.nombre,
                        telefono: aux.telefono || '',
                        username: auxiliares[index].username,
                        password: auxiliares[index].password,
                        role: 'auxiliar'
                    });
                    usersCambiados = true;
                }
            });
            
            // Sincronizar zodiac
            zodiac.forEach((z, index) => {
                const existeEnUsers = users.some(u => u.id === z.id);
                
                if (!existeEnUsers) {
                    // Si no tiene username/password, generarlos automáticamente
                    if (!z.username || !z.password) {
                        const nombreSimple = z.nombre.toLowerCase().replace(/\s+/g, '');
                        zodiac[index].username = `zodiac_${nombreSimple}`;
                        zodiac[index].password = `zodiac123`;
                        zodiac[index].role = 'zodiac';
                        zodiacCambiados = true;
                    }
                    
                    // Añadir a users
                    users.push({
                        id: z.id,
                        nombre: z.nombre,
                        telefono: z.telefono || '',
                        username: zodiac[index].username,
                        password: zodiac[index].password,
                        role: 'zodiac'
                    });
                    usersCambiados = true;
                }
            });
            
            // Guardar cambios si hubo alguna actualización
            if (usersCambiados) {
                DB.set('users', users);
            }
            if (auxiliaresCambiados) {
                DB.set('auxiliares', auxiliares);
            }
            if (zodiacCambiados) {
                DB.set('zodiac', zodiac);
            }
            
            // Configurar listeners en tiempo real para sincronización
            setupRealtimeListeners();
        }
        
        // Listeners en tiempo real para sincronizar cambios
        function setupRealtimeListeners() {
            const collections = ['users', 'auxiliares', 'zodiac', 'barcos', 'sesiones', 'asistencias', 'satisfaccion', 'incidencias'];
            
            collections.forEach(collectionName => {
                db.collection('data').doc(collectionName).onSnapshot((doc) => {
                    if (doc.exists) {
                        DB.cache[collectionName] = {
                            data: doc.data().value,
                            timestamp: Date.now()
                        };
                        // Re-renderizar si hay cambios y no estamos en la vista de satisfacción
                        const params = new URLSearchParams(window.location.search);
                        if (params.get('view') !== 'satisfaccion' && currentUser) {
                            render();
                        }
                    }
                });
            });
        }

        // Estado global

        let currentView = 'dashboard';

        let editingTimonelId = null;
        let editingAuxiliarId = null;
        let editingZodiacId = null;

        let reconocimientoVoz = null;

        // Función para renderizar

                            <p class="text-gray-600">Cargando...</p>
                        </div>
                    </div>
                `;
                
                // Asegurar que los datos están cargados
                if (!DB.get('sesiones')) {
                    await DB.initCache();
                }
                
                app.innerHTML = renderSatisfaccionGenerica();
                attachSatisfaccionGenericaEvents();
                return;
            }
            
            // Verificar si es formulario de satisfacción por QR específico
            if (params.get('view') === 'satisfaccion') {
                // Mostrar loading mientras carga datos
                app.innerHTML = `

                attachSatisfaccionEvents(params.get('sesion'));
                return;

            // Login o dashboard
            if (!currentUser) {
                app.innerHTML = renderLogin();
                attachLoginEvents();
            } else {
                app.innerHTML = renderDashboard();
                attachDashboardEvents();
            }
        }

                            <input type="text" id="password" placeholder="Contraseña" required autocomplete="current-password"

                            <div id="loginError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-center"></div>

                    </div>

            `;
        }

        function attachLoginEvents() {
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const users = DB.get('users');
                
                if (!users || users.length === 0) {
                    const errorDiv = document.getElementById('loginError');
                    errorDiv.textContent = 'Error del sistema: No hay usuarios registrados';
                    errorDiv.classList.remove('hidden');
                    return;
                }
                
                // Buscar TODOS los usuarios con este username/password (puede haber múltiples roles)
                const matchingUsers = users.filter(u => u.username === username && u.password === password);
                
                if (matchingUsers.length > 0) {
                    // Si hay múltiples roles, usar el primero pero guardar el username para búsqueda
                    currentUser = {
                        ...matchingUsers[0],
                        username: username,  // Guardar username para búsqueda en dashboard
                        allRoles: matchingUsers.map(u => u.role) // Guardar todos los roles
                    };
                    currentView = 'dashboard';
                    render();
                } else {
                    const errorDiv = document.getElementById('loginError');
                    errorDiv.textContent = 'Usuario o contraseña incorrectos';
                    errorDiv.classList.remove('hidden');
                }
            });
        }

                } else if (currentView === 'zodiac') {
                    content = renderZodiac();

                    content = renderBarcos();
                } else if (currentView === 'sesiones') {

                } else if (currentView === 'incidencias') {

                        ${currentUser.role === 'admin' ? `

                                    <button onclick="changeView('timoneles')" class="px-6 py-3 ${currentView === 'timoneles' ? 'bg-blue-900 border-b-4 border-blue-400' : 'hover:bg-blue-700'}">👤 Timoneles</button>
                                    <button onclick="changeView('auxiliares')" class="px-6 py-3 ${currentView === 'auxiliares' ? 'bg-blue-900 border-b-4 border-blue-400' : 'hover:bg-blue-700'}">🆘 Auxiliares</button>

        // DASHBOARD TIMONEL
        function renderDashboardTimonel() {
            const sesiones = DB.get('sesiones') || [];
            const users = DB.get('users') || [];
            const auxiliares = DB.get('auxiliares') || [];
            const zodiac = DB.get('zodiac') || [];
            const hoy = new Date().toISOString().split('T')[0];
            
            // Encontrar todas las sesiones donde el usuario actual esté asignado en CUALQUIER rol
            // Comparar por username para detectar la misma persona en diferentes tablas
            const todasMisSesiones = sesiones.map(s => {
                const rolesEnSesion = [];
                
                // Verificar si es timonel principal
                const timonel1 = users.find(u => u.id === s.timonelId);
                if (timonel1 && timonel1.username === currentUser.username) {
                    rolesEnSesion.push('timonel1');
                }
                
                // Verificar si es timonel secundario
                const timonel2 = s.timonel2Id ? users.find(u => u.id === s.timonel2Id) : null;
                if (timonel2 && timonel2.username === currentUser.username) {
                    rolesEnSesion.push('timonel2');
                }
                
                // Verificar si es auxiliar principal
                const aux1 = auxiliares.find(a => a.id === s.auxiliarId);
                if (aux1 && aux1.username === currentUser.username) {
                    rolesEnSesion.push('auxiliar1');
                }
                
                // Verificar si es auxiliar secundario
                const aux2 = s.auxiliar2Id ? auxiliares.find(a => a.id === s.auxiliar2Id) : null;
                if (aux2 && aux2.username === currentUser.username) {
                    rolesEnSesion.push('auxiliar2');
                }
                
                // Verificar si es zodiac
                const zod = zodiac.find(z => z.id === s.zodiacId);
                if (zod && zod.username === currentUser.username) {
                    rolesEnSesion.push('zodiac');
                }
                
                return {
                    ...s,
                    misRoles: rolesEnSesion
                };
            }).filter(s => s.misRoles.length > 0); // Solo sesiones donde tenga al menos un rol
            
            // Separar sesiones en tres grupos
            const sesionesHoy = todasMisSesiones.filter(s => s.fecha === hoy);
            const sesionesFuturas = todasMisSesiones.filter(s => s.fecha > hoy).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.horario.localeCompare(b.horario));
            const sesionesPasadas = todasMisSesiones.filter(s => s.fecha < hoy).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.horario.localeCompare(a.horario));

            const renderSesion = (s, esHoy) => {
                const asist = DB.get('asistencias') || [];
                const tieneAsistencia = asist.some(a => a.sesionId === s.id);
                const timonel = users.find(u => u.id === s.timonelId);
                const timonel2 = s.timonel2Id ? users.find(u => u.id === s.timonel2Id) : null;
                const auxiliar = auxiliares.find(a => a.id === s.auxiliarId);
                const auxiliar2 = s.auxiliar2Id ? auxiliares.find(a => a.id === s.auxiliar2Id) : null;
                const zodiacPersona = zodiac.find(z => z.id === s.zodiacId);
                const barcos = DB.get('barcos') || [];
                const barco = barcos.find(b => b.id === s.barcoId);
                const incidencias = DB.get('incidencias') || [];
                const tieneIncidencia = incidencias.some(inc => inc.sesionId === s.id);
                
                // Determinar si puede editar (solo timoneles pueden editar)
                const esMiSesionComoTimonel = s.misRoles.includes('timonel1') || s.misRoles.includes('timonel2');
                
                // Generar badges de roles con colores distintivos
                const rolesHTML = s.misRoles.map(rol => {
                    const rolesConfig = {
                        'timonel1': { texto: '👤 Timonel Principal', color: 'bg-blue-100 text-blue-700 border-2 border-blue-400' },
                        'timonel2': { texto: '👤 Timonel 2', color: 'bg-blue-100 text-blue-600 border-2 border-blue-300' },
                        'auxiliar1': { texto: '🆘 Auxiliar Principal', color: 'bg-green-100 text-green-700 border-2 border-green-400' },
                        'auxiliar2': { texto: '🆘 Auxiliar 2', color: 'bg-green-100 text-green-600 border-2 border-green-300' },
                        'zodiac': { texto: '🚤 Zodiac', color: 'bg-orange-100 text-orange-700 border-2 border-orange-400' }
                    };
                    const config = rolesConfig[rol];
                    return `<span class="px-3 py-1 ${config.color} rounded-full text-sm font-bold">${config.texto}</span>`;
                }).join(' ');
                
                // Color de borde según el rol principal
                let borderColor = 'border-gray-200';
                if (s.misRoles.includes('timonel1') || s.misRoles.includes('timonel2')) {
                    borderColor = 'border-blue-400';
                } else if (s.misRoles.includes('auxiliar1') || s.misRoles.includes('auxiliar2')) {
                    borderColor = 'border-green-400';
                } else if (s.misRoles.includes('zodiac')) {
                    borderColor = 'border-orange-400';
                }
                
                return `
                <div class="bg-white rounded-xl shadow-lg p-8 hover:shadow-2xl transition border-4 ${borderColor} ${s.cerrada ? 'bg-gray-100' : ''} ${!esHoy ? 'opacity-75' : ''}">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-3xl font-bold mb-2">${s.nombre || s.tipo}</h3>
                            <div class="flex flex-wrap gap-2 mb-2">
                                ${rolesHTML}
                            </div>
                            <span class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-bold">${s.tipo}</span>
                        </div>
                        <div class="flex flex-col gap-2">
                            ${tieneAsistencia ? '<span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-bold">✓ Registrada</span>' : ''}
                            ${s.cerrada ? '<span class="px-3 py-1 bg-red-500 text-white rounded-full text-sm font-bold">CERRADA</span>' : ''}
                        </div>
                    </div>
                    <div class="space-y-2 text-gray-600 mb-6">
                        <p>📅 ${new Date(s.fecha).toLocaleDateString('es-ES')}</p>
                        <p>⏰ ${s.horario}</p>
                        ${barco ? `<p>🛶 Barco: ${barco.nombre}</p>` : ''}
                        <p>👤 Representante: ${s.representante || '-'}</p>
                        <p>📞 ${s.telefonoRepresentante || '-'}</p>
                        ${timonel ? `<p>👤 Timonel: ${timonel.nombre}</p>` : ''}
                        ${timonel2 ? `<p>👤 Timonel 2: ${timonel2.nombre}</p>` : ''}
                        ${auxiliar ? `<p>🆘 Auxiliar: ${auxiliar.nombre}</p>` : ''}
                        ${auxiliar2 ? `<p>🆘 Auxiliar 2: ${auxiliar2.nombre}</p>` : ''}
                        ${zodiacPersona ? `<p>🚤 Zodiac: ${zodiacPersona.nombre}</p>` : ''}
                        <p>👥 ${s.participantes.length} participantes</p>
                    </div>
                    ${esHoy && !s.cerrada && esMiSesionComoTimonel ? `
                        <button onclick="verSesionTimonel(${s.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-lg font-bold mb-2">
                            ${tieneAsistencia ? 'Ver/Editar Asistencia →' : 'Registrar Asistencia →'}
                        </button>
                        ${!tieneIncidencia ? `
                            <button onclick="abrirModalIncidencia(${s.id})" class="w-full bg-orange-600 hover:bg-orange-700 text-white px-6 py-4 rounded-lg font-bold mb-2">
                                ⚠️ Registrar Incidencia
                            </button>
                        ` : ''}
                        <button onclick="cerrarSesionSinIncidencias(${s.id})" class="w-full bg-green-600 hover:bg-green-700 text-white px-6 py-4 rounded-lg font-bold">
                            ✓ Cerrar Sesión
                        </button>
                    ` : s.cerrada || !esMiSesionComoTimonel || !esHoy ? `
                        <button onclick="verSesionTimonelSoloLectura(${s.id})" class="w-full bg-gray-400 hover:bg-gray-500 text-white px-6 py-4 rounded-lg font-bold">
                            👁️ Ver Detalles (Solo lectura)
                        </button>
                    ` : `
                        <button onclick="verSesionTimonelSoloLectura(${s.id})" class="w-full bg-gray-400 hover:bg-gray-500 text-white px-6 py-4 rounded-lg font-bold">
                            ${s.fecha > hoy ? '📅 Sesión futura (Solo lectura)' : '📅 Sesión pasada (Solo lectura)'}
                        </button>
                    `}
                </div>
            `;
            };

            return `
                <div class="container mx-auto px-4 py-8">
                    <div class="mb-6">
                        <h2 class="text-4xl font-bold mb-2">Mis Sesiones</h2>
                        <p class="text-gray-600">Sesiones donde estás asignado en cualquier rol (Timonel, Auxiliar o Zodiac)</p>
                    </div>
                    
                    ${sesionesFuturas.length > 0 ? `
                        <div class="mb-8">
                            <h3 class="text-2xl font-bold mb-4 text-green-600">📅 Sesiones Futuras (${sesionesFuturas.length})</h3>
                            <div class="grid md:grid-cols-2 gap-6">
                                ${sesionesFuturas.map(s => renderSesion(s, false)).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    <div class="mb-8">
                        <h3 class="text-2xl font-bold mb-4 text-blue-600">📅 Sesiones de HOY (${new Date().toLocaleDateString('es-ES')})</h3>
                        ${sesionesHoy.length === 0 ? `
                            <div class="bg-white rounded-xl shadow-lg p-16 text-center">
                                <div class="text-8xl mb-4">🛶</div>
                                <h3 class="text-3xl font-bold mb-2">Sin sesiones hoy</h3>
                                <p class="text-xl text-gray-600">No hay sesiones asignadas para hoy</p>
                            </div>
                        ` : `
                            <div class="grid md:grid-cols-2 gap-6">
                                ${sesionesHoy.map(s => renderSesion(s, true)).join('')}
                            </div>
                        `}
                    </div>
                    
                    ${sesionesPasadas.length > 0 ? `
                        <div class="mb-8">
                            <h3 class="text-2xl font-bold mb-4 text-gray-500">📅 Sesiones Pasadas (${sesionesPasadas.length})</h3>
                            <div class="grid md:grid-cols-2 gap-6">
                                ${sesionesPasadas.map(s => renderSesion(s, false)).join('')}
                            </div>
                        </div>
                    ` : ''}
                    
                    <div id="modalSesionTimonel" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4" onclick="event.stopPropagation()">
                        <div class="bg-white rounded-2xl p-8 max-w-6xl w-full max-h-screen overflow-y-auto" onclick="event.stopPropagation()">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-3xl font-bold">Registro de Asistencia</h3>
                                <button onclick="cerrarModal('modalSesionTimonel')" class="text-4xl hover:text-red-600">&times;</button>
                            </div>
                            <div id="contenidoSesionTimonel"></div>
                        </div>
                    </div>
                    
                    <div id="modalIncidencia" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                        <div class="bg-white rounded-2xl p-8 max-w-2xl w-full max-h-screen overflow-y-auto" onclick="event.stopPropagation()">

                        </div>
                    </div>
                </div>
            `;
        }

        // INFORMES
        function renderInformes() {
            const mes = new Date().toISOString().slice(0, 7);
            const sesiones = DB.get('sesiones') || [];
            const asistencias = DB.get('asistencias') || [];
            const satisfaccion = DB.get('satisfaccion') || [];
            
            const sm = sesiones.filter(s => s.fecha.startsWith(mes));
            const am = asistencias.filter(a => {
                const s = sesiones.find(x => x.id === a.sesionId);
                return s && s.fecha.startsWith(mes);
            });
            
            // Calcular participantes totales y asistencias
            let totalPlazas = 0;
            let totalAsistencias = 0;
            sm.forEach(s => {
                totalPlazas += s.participantes.length;
                const asist = asistencias.find(a => a.sesionId === s.id);
                if (asist) {
                    totalAsistencias += Object.values(asist.asistencias).filter(a => a).length;
                }
            });
            
            const tasaAsistencia = totalPlazas > 0 ? ((totalAsistencias / totalPlazas) * 100).toFixed(1) : 0;
            
            const satMes = satisfaccion.filter(s => new Date(s.fecha).toISOString().slice(0, 7) === mes);
            const satProm = satMes.length > 0 ? (satMes.reduce((s, x) => s + x.valoracion, 0) / satMes.length).toFixed(1) : 0;

            return `
                <div class="container mx-auto px-4 py-8">
                    <div class="flex justify-between mb-6">
                        <h2 class="text-4xl font-bold">Informes Mensuales</h2>
                        <button onclick="exportarCSV()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold">📥 Exportar CSV</button>
                    </div>
                    <div class="grid md:grid-cols-5 gap-6">
                        <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-lg p-6 text-white">
                            <p class="text-sm opacity-90 mb-1">Sesiones</p>
                            <p class="text-5xl font-bold">${sm.length}</p>
                        </div>
                        <div class="bg-gradient-to-br from-green-500 to-green-600 rounded-xl shadow-lg p-6 text-white">
                            <p class="text-sm opacity-90 mb-1">Plazas Totales</p>
                            <p class="text-5xl font-bold">${totalPlazas}</p>
                        </div>
                        <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl shadow-lg p-6 text-white">
                            <p class="text-sm opacity-90 mb-1">Asistencias</p>
                            <p class="text-5xl font-bold">${totalAsistencias}</p>
                        </div>
                        <div class="bg-gradient-to-br from-orange-500 to-orange-600 rounded-xl shadow-lg p-6 text-white">
                            <p class="text-sm opacity-90 mb-1">Tasa Asistencia</p>
                            <p class="text-5xl font-bold">${tasaAsistencia}%</p>
                        </div>
                        <div class="bg-gradient-to-br from-pink-500 to-pink-600 rounded-xl shadow-lg p-6 text-white">
                            <p class="text-sm opacity-90 mb-1">Satisfacción</p>
                            <p class="text-5xl font-bold">${satProm}/5</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Generar vista de calendario mensual estilo Google Calendar
        function generarVistaCalendarioMensual(estadoCalendario) {
            const { mes, año, tipoActual } = estadoCalendario;
            const eventosCalendario = DB.get('eventosCalendario') || [];
            
            // Filtrar eventos del tipo seleccionado
            const eventosFiltrados = eventosCalendario.filter(e => e.tipo === tipoActual);
            
            // Nombres de meses y días
            const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                                 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            const nombresDias = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
            
            // Obtener primer día del mes y total de días
            const primerDia = new Date(año, mes, 1);
            const ultimoDia = new Date(año, mes + 1, 0);
            const totalDias = ultimoDia.getDate();
            
            // Obtener día de la semana (0=Domingo, 1=Lunes, etc)
            let primerDiaSemana = primerDia.getDay();
            // Ajustar para que Lunes sea 0
            primerDiaSemana = primerDiaSemana === 0 ? 6 : primerDiaSemana - 1;
            
            // Títulos según tipo
            const titulos = {
                'sesiones': '📅 Calendario de Sesiones',
                'timoneles': '👤 Calendario de Timoneles',
                'auxiliares': '🆘 Calendario de Auxiliares',
                'zodiac': '🚤 Calendario de Zodiac'
            };
            
            const colores = {
                'sesiones': 'bg-blue-500',
                'timoneles': 'bg-green-500',
                'auxiliares': 'bg-orange-500',
                'zodiac': 'bg-purple-500'
            };
            
            // Header con navegación
            let html = `
                <div class="mb-3">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex gap-2 items-center">
                            <button onclick="volverSeleccionCalendario()" 
                                class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded font-bold text-sm">
                                ← Volver
                            </button>
                            <h3 class="text-2xl font-bold">${titulos[tipoActual]}</h3>
                        </div>
                        <div class="flex gap-2 items-center">
                            <button onclick="cambiarMesCalendario(-1)" 
                                class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded font-bold text-sm">
                                ◀
                            </button>
                            <span class="text-lg font-bold px-3">${nombresMeses[mes]} ${año}</span>
                            <button onclick="cambiarMesCalendario(1)" 
                                class="px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded font-bold text-sm">
                                ▶
                            </button>
                            <button onclick="irAHoyCalendario()" 
                                class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold text-sm">
                                Hoy
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Grid de días -->
                <div class="border rounded-lg overflow-hidden">
                    <!-- Header de días de la semana -->
                    <div class="grid grid-cols-7 bg-gray-100 border-b">
                        ${nombresDias.map(dia => `
                            <div class="p-2 text-center font-bold text-gray-700 border-r last:border-r-0 text-sm">
                                ${dia}
                            </div>
                        `).join('')}
                    </div>
                    
                    <!-- Días del mes -->
                    <div class="grid grid-cols-7" style="grid-auto-rows: minmax(80px, auto);">
            `;
            
            // Agregar días vacíos al inicio
            for (let i = 0; i < primerDiaSemana; i++) {
                html += `<div class="border-r border-b bg-gray-50"></div>`;
            }
            
            // Agregar días del mes
            for (let dia = 1; dia <= totalDias; dia++) {
                const fechaActual = `${año}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                const hoy = new Date();
                const esHoy = año === hoy.getFullYear() && mes === hoy.getMonth() && dia === hoy.getDate();
                
                // Buscar eventos de este día
                const eventosDelDia = eventosFiltrados.filter(e => e.fecha === fechaActual);
                
                html += `
                    <div class="border-r border-b p-1 ${esHoy ? 'bg-blue-50' : 'bg-white'} hover:bg-gray-50">
                        <div class="font-bold text-right mb-1 ${esHoy ? 'text-blue-600 text-base' : 'text-gray-700 text-sm'}">
                            ${dia}
                        </div>
                        <div class="space-y-0.5">
                            ${eventosDelDia.map(evento => `
                                <div onclick="mostrarDetalleEvento(${evento.sesionId})" 
                                    class="${colores[tipoActual]} text-white text-xs p-0.5 rounded cursor-pointer hover:opacity-80 truncate"
                                    title="${evento.titulo}">
                                    ${evento.horario} ${evento.titulo.length > 15 ? evento.titulo.substring(0, 15) + '...' : evento.titulo}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            // Completar última semana con días vacíos si es necesario
            const totalCeldas = primerDiaSemana + totalDias;
            const celdasRestantes = (7 - (totalCeldas % 7)) % 7;
            for (let i = 0; i < celdasRestantes; i++) {
                html += `<div class="border-r border-b bg-gray-50"></div>`;
            }
            
            html += `
                    </div>
                </div>
            `;
            
            return html;
        }

        function attachSatisfaccionEvents(sesionId) {
            let valoracion = 5;
            window.setValoracion = function(val) {
                valoracion = val;
                document.getElementById('valorActual').textContent = val;
                const btns = document.querySelectorAll('#formSatisfaccion button[type="button"]');
                btns.forEach((btn, i) => {
                    btn.style.opacity = i < val ? '1' : '0.3';
                    btn.style.transform = i < val ? 'scale(1.25)' : 'scale(1)';
                });
            };
            setValoracion(5);

            document.getElementById('formSatisfaccion').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Obtener y normalizar DNI
                const dniInput = document.getElementById('satDNI').value.trim().toUpperCase().replace(/\s+/g, '');
                const errorDNI = document.getElementById('errorDNI');
                
                // Validar formato DNI/NIE
                const regexDNI = /^[0-9]{8}[A-Z]$/;
                const regexNIE = /^[XYZ][0-9]{7}[A-Z]$/;
                
                if (!regexDNI.test(dniInput) && !regexNIE.test(dniInput)) {
                    errorDNI.textContent = '❌ Formato de DNI/NIE incorrecto';
                    errorDNI.classList.remove('hidden');
                    return;
                }
                
                // Verificar que el DNI pertenece a la sesión
                const sesiones = DB.get('sesiones') || [];
                const sesion = sesiones.find(s => s.id === parseInt(sesionId));
                
                if (!sesion) {
                    errorDNI.textContent = '❌ Sesión no encontrada';
                    errorDNI.classList.remove('hidden');
                    return;
                }
                
                const participante = sesion.participantes.find(p => 
                    p.dni && p.dni.toUpperCase().replace(/\s+/g, '') === dniInput
                );
                
                if (!participante) {
                    errorDNI.textContent = '❌ No perteneces a esta sesión';
                    errorDNI.classList.remove('hidden');
                    return;
                }
                
                // Verificar que no haya valorado antes
                const satisfacciones = DB.get('satisfaccion') || [];
                const yaValoro = satisfacciones.some(s => 
                    s.sesionId === parseInt(sesionId) && 
                    s.dni && s.dni.toUpperCase().replace(/\s+/g, '') === dniInput
                );
                
                if (yaValoro) {
                    errorDNI.textContent = '⚠️ Ya has valorado esta sesión anteriormente';
                    errorDNI.classList.remove('hidden');
                    return;
                }
                
                // Guardar valoración
                const data = DB.get('satisfaccion') || [];
                DB.set('satisfaccion', [...data, {
                    sesionId: parseInt(sesionId),
                    dni: dniInput,
                    nombreParticipante: participante.nombre,
                    valoracion: valoracion,
                    observaciones: document.getElementById('satObs').value,
                    fecha: new Date().toISOString()
                }]);
                
                document.querySelector('#app').innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-green-500 to-green-600 flex items-center justify-center p-4">
                        <div class="bg-white rounded-2xl shadow-2xl p-12 text-center">
                            <div class="text-8xl mb-4">✅</div>
                            <h2 class="text-4xl font-bold mb-2">¡Gracias!</h2>
                            <p class="text-xl text-gray-600">Valoración registrada correctamente</p>
                        </div>
                    </div>
                `;
            });
        }

        // WHATSAPP
        function enviarWhatsAppSesion(sesionId) {
            const sesiones = DB.get('sesiones') || [];
            const sesion = sesiones.find(s => s.id === sesionId);
            if (!sesion) return;

            const users = DB.get('users') || [];
            const auxiliares = DB.get('auxiliares') || [];
            const zodiac = DB.get('zodiac') || [];
            const barcos = DB.get('barcos') || [];
            
            const timonel = users.find(u => u.id === sesion.timonelId);
            const timonel2 = sesion.timonel2Id ? users.find(u => u.id === sesion.timonel2Id) : null;
            const auxiliar = auxiliares.find(a => a.id === sesion.auxiliarId);
            const auxiliar2 = sesion.auxiliar2Id ? auxiliares.find(a => a.id === sesion.auxiliar2Id) : null;
            const zodiacPersona = zodiac.find(z => z.id === sesion.zodiacId);
            const barco = barcos.find(b => b.id === sesion.barcoId);

            // Preparar mensaje
            const fecha = new Date(sesion.fecha).toLocaleDateString('es-ES', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            const mensajeBase = `🛶 *Nueva Sesión Asignada*\n\n` +
                `📋 *Sesión:* ${sesion.nombre || sesion.tipo}\n` +
                `🏷️ *Tipo:* ${sesion.tipo}\n` +
                `📅 *Fecha:* ${fecha}\n` +
                `⏰ *Hora:* ${sesion.horario}\n` +
                (barco ? `🛶 *Barco:* ${barco.nombre}\n` : '') +
                `👤 *Representante:* ${sesion.representante}\n` +
                `📞 *Teléfono:* ${sesion.telefonoRepresentante}\n` +
                `👥 *Participantes:* ${sesion.participantes.length}\n\n`;

            const mensajes = [];

            // Preparar mensaje para Timonel 1
            if (timonel && timonel.telefono) {
                const telefono = timonel.telefono.replace(/\D/g, '');
                if (telefono) {
                    const mensajeTimonel = mensajeBase + `👤 *Tu rol:* Timonel Principal`;
                    mensajes.push({
                        telefono: telefono,
                        mensaje: mensajeTimonel,
                        nombre: timonel.nombre,
                        rol: 'Timonel Principal'
                    });
                }
            }

            // Preparar mensaje para Timonel 2
            if (timonel2 && timonel2.telefono) {
                const telefono = timonel2.telefono.replace(/\D/g, '');
                if (telefono) {
                    const mensajeTimonel2 = mensajeBase + 
                        `👤 *Tu rol:* Timonel Secundario\n` +
                        `👤 *Timonel Principal:* ${timonel ? timonel.nombre : '-'}`;
                    mensajes.push({
                        telefono: telefono,
                        mensaje: mensajeTimonel2,
                        nombre: timonel2.nombre,
                        rol: 'Timonel Secundario'
                    });
                }
            }

            // Preparar mensaje para Auxiliar 1
            if (auxiliar && auxiliar.telefono) {
                const telefono = auxiliar.telefono.replace(/\D/g, '');
                if (telefono) {
                    const mensajeAuxiliar = mensajeBase + 
                        `🆘 *Tu rol:* Auxiliar Principal\n` +
                        `👤 *Timonel:* ${timonel ? timonel.nombre : '-'}`;
                    mensajes.push({
                        telefono: telefono,
                        mensaje: mensajeAuxiliar,
                        nombre: auxiliar.nombre,
                        rol: 'Auxiliar Principal'
                    });
                }
            }

            // Preparar mensaje para Auxiliar 2
            if (auxiliar2 && auxiliar2.telefono) {
                const telefono = auxiliar2.telefono.replace(/\D/g, '');
                if (telefono) {
                    const mensajeAuxiliar2 = mensajeBase + 
                        `🆘 *Tu rol:* Auxiliar Secundario\n` +
                        `👤 *Timonel:* ${timonel ? timonel.nombre : '-'}`;
                    mensajes.push({
                        telefono: telefono,
                        mensaje: mensajeAuxiliar2,
                        nombre: auxiliar2.nombre,
                        rol: 'Auxiliar Secundario'
                    });
                }
            }

            // Preparar mensaje para Zodiac
            if (zodiacPersona && zodiacPersona.telefono) {
                const telefono = zodiacPersona.telefono.replace(/\D/g, '');
                if (telefono) {
                    const mensajeZodiac = mensajeBase + 
                        `🚤 *Tu rol:* Zodiac\n` +
                        `👤 *Timonel:* ${timonel ? timonel.nombre : '-'}`;
                    mensajes.push({
                        telefono: telefono,
                        mensaje: mensajeZodiac,
                        nombre: zodiacPersona.nombre,
                        rol: 'Zodiac'
                    });
                }
            }

            if (mensajes.length === 0) {
                alert('⚠️ No hay números de teléfono registrados para enviar WhatsApp');
                return;
            }

            // Mostrar modal con enlaces de WhatsApp
            mostrarModalWhatsApp(mensajes);
        }

        function mostrarModalWhatsApp(mensajes) {
            const modal = document.createElement('div');
            modal.id = 'modalWhatsApp';
            modal.className = 'fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4';
            modal.onclick = function(e) {
                if (e.target === modal) cerrarModalWhatsApp();
            };

            const enlaces = mensajes.map((m, index) => {
                const url = `https://wa.me/${m.telefono}?text=${encodeURIComponent(m.mensaje)}`;
                return `
                    <div class="border-2 border-gray-200 rounded-lg p-4 hover:bg-green-50 hover:border-green-500 transition">
                        <div class="flex items-center justify-between">
                            <div class="flex-1">
                                <p class="font-bold text-lg">${m.nombre}</p>
                                <p class="text-gray-600">${m.rol}</p>
                                <p class="text-sm text-gray-500">📱 ${m.telefono}</p>
                            </div>
                            <a href="${url}" target="_blank" 
                                class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-bold whitespace-nowrap">
                                📱 Enviar WhatsApp
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            modal.innerHTML = `
                <div class="bg-white rounded-2xl p-8 max-w-3xl w-full max-h-screen overflow-y-auto" onclick="event.stopPropagation()">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-3xl font-bold">📱 Enviar WhatsApp</h3>
                        <button onclick="cerrarModalWhatsApp()" class="text-4xl hover:text-red-600">&times;</button>
                    </div>
                    <p class="text-gray-600 mb-6">Haz clic en cada botón para enviar el WhatsApp correspondiente:</p>
                    <div class="space-y-4">
                        ${enlaces}
                    </div>
                    <div class="mt-6 flex justify-end">
                        <button onclick="cerrarModalWhatsApp()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-6 py-3 rounded-lg font-bold">
                            Cerrar
                        </button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        // SESIONES
        window.actualizarCamposSesion = function() {
            const tipoSesion = document.getElementById('sTipo').value;
            const tiposConAuxiliarObligatorio = ['Menores', 'Once', 'Paradragón'];
            const tiposConZodiacObligatorio = ['Menores', 'Once', 'Paradragón'];
            
            const camposAdicionales = document.getElementById('camposAdicionales');
            const selectAuxiliar = document.getElementById('sAuxiliar');
            const selectZodiac = document.getElementById('sZodiac');
            const selectTimonel = document.getElementById('sTimonel');
            const selectBarco = document.getElementById('sBarco');
            
            // Cargar opciones de zodiac siempre (ahora está visible siempre)
            const zodiac = DB.get('zodiac') || [];
            selectZodiac.innerHTML = '<option value="">Seleccionar zodiac...</option>' +
                zodiac.map(z => `<option value="${z.id}">${z.nombre}</option>`).join('');
            
            // Tipo Tierra: Nada es obligatorio
            if (tipoSesion === 'Tierra') {
                selectTimonel.required = false;
                selectBarco.required = false;
                selectAuxiliar.required = false;
                selectZodiac.required = false;
                camposAdicionales.classList.add('hidden');
                selectAuxiliar.value = '';
                
                // Cambiar labels para indicar que son opcionales
                const labelTimonel = selectTimonel.previousElementSibling;
                const labelBarco = selectBarco.previousElementSibling;
                const labelZodiac = selectZodiac.previousElementSibling;
                if (labelTimonel) labelTimonel.textContent = 'Timonel (Opcional)';
                if (labelBarco) labelBarco.textContent = 'Barco (Opcional)';
                if (labelZodiac) labelZodiac.textContent = 'Zodiac (Opcional)';
            } else {
                // Para otros tipos, timonel y barco dependen de si hay participantes
                
                // Restaurar labels normales
                const labelTimonel = selectTimonel.previousElementSibling;
                const labelBarco = selectBarco.previousElementSibling;
                const labelZodiac = selectZodiac.previousElementSibling;
                
                // Zodiac es obligatorio solo para ciertos tipos
                if (tiposConZodiacObligatorio.includes(tipoSesion)) {
                    selectZodiac.required = true;
                    if (labelZodiac) labelZodiac.textContent = 'Zodiac (Obligatorio)';
                } else {
                    selectZodiac.required = false;
                    if (labelZodiac) labelZodiac.textContent = 'Zodiac (Opcional)';
                }
                
                // Mostrar/ocultar campo de auxiliar según tipo
                if (tiposConAuxiliarObligatorio.includes(tipoSesion)) {
                    camposAdicionales.classList.remove('hidden');
                    selectAuxiliar.required = true;
                    
                    // Cargar opciones de auxiliares
                    const auxiliares = DB.get('auxiliares') || [];
                    selectAuxiliar.innerHTML = '<option value="">Seleccionar auxiliar...</option>' +
                        auxiliares.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('');
                } else {

            const tipoSesion = document.getElementById('sTipo').value;
            const camposPersonalAdicional = document.getElementById('camposPersonalAdicional');
            const selectTimonel = document.getElementById('sTimonel');
            const selectBarco = document.getElementById('sBarco');

            const selectAuxiliar2 = document.getElementById('sAuxiliar2');
            
            // VALIDACIÓN CRÍTICA: Timonel y Barco son obligatorios solo si hay participantes (excepto tipo Tierra)
            if (tipoSesion !== 'Tierra') {

                const labelBarco = selectBarco.previousElementSibling;
                
                if (numParticipantes > 0) {
                    selectTimonel.required = true;
                    selectBarco.required = true;
                    if (labelTimonel) labelTimonel.textContent = 'Timonel Asignado (Obligatorio)';
                    if (labelBarco) labelBarco.textContent = 'Barco Asignado (Obligatorio)';
                } else {

                    if (labelTimonel) labelTimonel.textContent = 'Timonel Asignado (Opcional sin participantes)';
                    if (labelBarco) labelBarco.textContent = 'Barco Asignado (Opcional sin participantes)';
                }
            }
            
            // Tipos que requieren SOLO segundo timonel cuando hay más de 20 participantes
            const tiposConSegundoTimonel = ['Veteranos', 'Iniciación', 'Formación', 'Mujer', 'Terapéutico', 'Empresa'];
            
            // Tipos que requieren auxiliar y zodiac siempre
            const tiposConAuxiliarYZodiac = ['Menores', 'Once', 'Paradragón'];
            
            if (numParticipantes > 20) {
                camposPersonalAdicional.classList.remove('hidden');
                
                // Cargar timoneles para segundo timonel
                const users = DB.get('users') || [];
                const timoneles = users.filter(u => u.role === 'timonel');
                const timonelActual = document.getElementById('sTimonel').value;
                selectTimonel2.innerHTML = '<option value="">Seleccionar segundo timonel...</option>' +

                    selectAuxiliar2.required = true;

                    // Cambiar el mensaje del aviso
                    const parrafo = camposPersonalAdicional.querySelector('p');
                    if (parrafo) {
                        parrafo.textContent = '⚠️ Más de 20 participantes - Se requiere segundo timonel y segundo auxiliar';

                    if (divAuxiliar2) divAuxiliar2.style.display = 'block';
                }
            } else {
                camposPersonalAdicional.classList.add('hidden');
                selectTimonel2.required = false;
                selectAuxiliar2.required = false;

            // Actualizar aviso de participantes

        window.cargarExcel = function() {
            const file = document.getElementById('excelFile').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                // Detectar fila de encabezados (buscar "nombre", "dni", etc.)
                let headerRowIndex = -1;
                for (let i = 0; i < Math.min(5, rows.length); i++) {
                    const row = rows[i];
                    const hasCommonHeaders = row.some(cell => {
                        const str = String(cell).toLowerCase();
                        return str.includes('nombre') || str.includes('dni') || str.includes('nacimiento');
                    });
                    if (hasCommonHeaders) {
                        headerRowIndex = i;
                        break;
                    }
                }

                if (headerRowIndex === -1) {
                    alert('⚠️ No se encontró una fila de encabezados válida en el Excel');
                    return;
                }

                const headers = rows[headerRowIndex].map(h => String(h).toLowerCase().trim());
                const dataRows = rows.slice(headerRowIndex + 1).filter(row => row.some(cell => cell !== '' && cell !== null && cell !== undefined));

                // Convertir a objetos con claves normalizadas
                const normalizedData = dataRows.map(row => {
                    const obj = {};
                    headers.forEach((header, index) => {
                        obj[header] = row[index];
                    });
                    return obj;
                });

                // Procesar participantes
                normalizedData.forEach(row => {
                    let nombre = '', dni = '', fechaNac = '', sabeNadar = 'si', necesidades = '', observaciones = '';
                    
                    Object.keys(row).forEach(key => {
                        const keyLower = key.toLowerCase();
                        if (keyLower.includes('nombre')) nombre = row[key] || '';
                        if (keyLower.includes('dni') || keyLower.includes('documento')) dni = row[key] || '';
                        if (keyLower.includes('nacimiento') || keyLower.includes('fecha')) {
                            fechaNac = row[key] || '';
                        }
                        if (keyLower.includes('nadar') || keyLower.includes('nada')) {
                            const valor = String(row[key]).toLowerCase();
                            sabeNadar = (valor === 'si' || valor === 'sí' || valor === 'yes') ? 'si' : 'no';
                        }
                        if (keyLower === 'necesidades') necesidades = row[key] || '';
                        if (keyLower === 'observaciones') observaciones = row[key] || '';
                    });

                    const participante = {
                        id: Date.now() + Math.random(),
                        nombre: nombre,
                        dni: dni,
                        fechaNacimiento: normalizarFecha(String(fechaNac)),
                        sabeNadar: sabeNadar,
                        necesidades: necesidades,
                        observaciones: observaciones
                    };
                    
                    // Verificar y añadir chaleco si es necesario
                    verificarYAñadirChaleco(participante);
                    
                    participantesSesion.push(participante);
                });
                
                actualizarListaParticipantes();
                verificarPersonalAdicional();
                alert(`✅ ${normalizedData.length} participantes importados`);
                document.getElementById('excelFile').value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        window.actualizarParticipante = function(index, campo, valor) {
            if (campo === 'fechaNacimiento') {
                valor = normalizarFecha(valor);
            }
            participantesSesion[index][campo] = valor;
            
            // Verificar si necesita chaleco después de cada cambio
            const p = participantesSesion[index];
            verificarYAñadirChaleco(p);
            
            actualizarListaParticipantes();
        };
        
        function verificarYAñadirChaleco(participante) {
            const edad = calcularEdadParticipante(participante.fechaNacimiento);
            const esMenor = edad > 0 && edad < 18;
            const noSabeNadar = participante.sabeNadar === 'no';
            
            // Añadir chaleco si es menor O no sabe nadar
            if (esMenor || noSabeNadar) {
                const necesidades = participante.necesidades || '';
                if (!necesidades.toLowerCase().includes('chaleco')) {
                    participante.necesidades = necesidades ? necesidades + ', chaleco' : 'chaleco';
                }
            }
        }
        
        function calcularEdadParticipante(fechaNac) {
            if (!fechaNac) return 0;
            const partes = fechaNac.split('/');
            if (partes.length !== 3) return 0;
            const hoy = new Date();
            const nac = new Date(partes[2], partes[1] - 1, partes[0]);
            let edad = hoy.getFullYear() - nac.getFullYear();
            const m = hoy.getMonth() - nac.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
            return edad;
        }

        window.eliminarParticipanteSesion = function(index) {
            participantesSesion.splice(index, 1);

        window.guardarSesion = function(e) {
            e.preventDefault();
            
            // Solo validar formato de fechas si están presentes
            for (let p of participantesSesion) {
                if (p.fechaNacimiento && p.fechaNacimiento.trim() !== '') {
                    const fechaNormalizada = normalizarFecha(p.fechaNacimiento);
                    if (fechaNormalizada && !/^\d{2}\/\d{2}\/\d{4}$/.test(fechaNormalizada)) {
                        const identificador = p.nombre || p.dni || 'un participante';
                        console.log('Error en fecha:', p.fechaNacimiento, 'normalizada:', fechaNormalizada);
                        alert(`⚠️ La fecha de nacimiento de "${identificador}" debe estar en formato DD/MM/AAAA o DD/MM/AA (recibido: ${p.fechaNacimiento})`);
                        return;
                    }
                    if (fechaNormalizada) {
                        p.fechaNacimiento = fechaNormalizada;
                    }
                }
            }
            
            const tipoSesion = document.getElementById('sTipo').value;
            const tiposConChaleco = ['Menores', 'Paradragón', 'Once', 'Inclusivo'];
            const sesionRequiereChaleco = tiposConChaleco.includes(tipoSesion);
            
            // Procesar cada participante
            participantesSesion.forEach(p => {
                const edad = calcularEdadParticipante(p.fechaNacimiento);
                const esMenor = edad > 0 && edad < 18;
                const noSabeNadar = p.sabeNadar === 'no';
                
                // Determinar si DEBE tener chaleco
                const debeTenerChaleco = sesionRequiereChaleco || esMenor || noSabeNadar;
                
                let necesidades = p.necesidades || '';
                const tieneChaleco = necesidades.toLowerCase().includes('chaleco');
                
                if (debeTenerChaleco && !tieneChaleco) {
                    // Añadir chaleco
                    p.necesidades = necesidades ? necesidades + ', chaleco' : 'chaleco';
                } else if (!debeTenerChaleco && tieneChaleco) {
                    // Eliminar chaleco (porque el tipo de sesión cambió y no es menor ni no sabe nadar)
                    necesidades = necesidades.replace(/,?\s*chaleco\s*/gi, '').replace(/^\s*,\s*/, '').trim();
                    p.necesidades = necesidades;
                }
            });
            
            const fecha = document.getElementById('sFecha').value;
            const horario = document.getElementById('sHorario').value;
            const timonelIdValue = document.getElementById('sTimonel').value;
            const timonelId = timonelIdValue ? parseInt(timonelIdValue) : null;
            
            // VALIDACIÓN: Si hay participantes y no es tipo Tierra, el timonel es obligatorio
            if (participantesSesion.length > 0 && tipoSesion !== 'Tierra' && !timonelId) {
                alert('⚠️ Debes asignar un timonel cuando hay participantes registrados');
                return;
            }
            
            // Obtener IDs de personal adicional
            const timonel2Id = document.getElementById('sTimonel2').value ? parseInt(document.getElementById('sTimonel2').value) : null;
            const auxiliarId = document.getElementById('sAuxiliar').value ? parseInt(document.getElementById('sAuxiliar').value) : null;
            const auxiliar2Id = document.getElementById('sAuxiliar2').value ? parseInt(document.getElementById('sAuxiliar2').value) : null;
            const zodiacId = document.getElementById('sZodiac').value ? parseInt(document.getElementById('sZodiac').value) : null;
            
            // VALIDACIÓN: La misma persona no puede estar en varios roles en la misma sesión
            // Comparar por username (no por ID) para detectar la misma persona en diferentes tablas
            const users = DB.get('users') || [];
            const auxiliares = DB.get('auxiliares') || [];
            const zodiac = DB.get('zodiac') || [];
            
            const personasAsignadas = [];
            
            if (timonelId) {
                const t = users.find(u => u.id === timonelId);
                if (t) personasAsignadas.push({username: t.username, nombre: t.nombre, rol: 'Timonel'});
            }
            if (timonel2Id) {
                const t2 = users.find(u => u.id === timonel2Id);
                if (t2) personasAsignadas.push({username: t2.username, nombre: t2.nombre, rol: 'Timonel 2'});
            }
            if (auxiliarId) {
                const a = auxiliares.find(aux => aux.id === auxiliarId);
                if (a) personasAsignadas.push({username: a.username, nombre: a.nombre, rol: 'Auxiliar'});
            }
            if (auxiliar2Id) {
                const a2 = auxiliares.find(aux => aux.id === auxiliar2Id);
                if (a2) personasAsignadas.push({username: a2.username, nombre: a2.nombre, rol: 'Auxiliar 2'});
            }
            if (zodiacId) {
                const z = zodiac.find(zod => zod.id === zodiacId);
                if (z) personasAsignadas.push({username: z.username, nombre: z.nombre, rol: 'Zodiac'});
            }
            
            // Buscar duplicados por username
            const usernamesCounted = {};
            for (const persona of personasAsignadas) {
                if (!usernamesCounted[persona.username]) {
                    usernamesCounted[persona.username] = {
                        nombre: persona.nombre,
                        roles: [persona.rol]
                    };
                } else {
                    usernamesCounted[persona.username].roles.push(persona.rol);
                }
            }
            
            // Verificar si hay alguna persona asignada a múltiples roles
            for (const [username, data] of Object.entries(usernamesCounted)) {
                if (data.roles.length > 1) {
                    alert(`⚠️ ${data.nombre} está asignada a múltiples roles en esta sesión: ${data.roles.join(', ')}.\n\nCada persona solo puede tener un rol por sesión.`);
                    return;
                }
            }
            
            // Validar que no haya duplicados de timoneles o auxiliares en la misma hora (solo si tipo no es Tierra)
            const sesiones = DB.get('sesiones') || [];
            const sesionesEnMismaHora = sesiones.filter(s => 
                s.fecha === fecha && 
                s.horario === horario && 
                (!editingSesionId || s.id !== editingSesionId)
            );
            
            // Verificar timoneles (solo si no es tipo Tierra)
            if (tipoSesion !== 'Tierra' && timonelId) {
                const timonelesDuplicados = sesionesEnMismaHora.filter(s => 
                    s.timonelId === timonelId || 
                    s.timonel2Id === timonelId ||
                    (timonel2Id && (s.timonelId === timonel2Id || s.timonel2Id === timonel2Id))
                );
                
                if (timonelesDuplicados.length > 0) {
                    const users = DB.get('users') || [];
                    const timonel = users.find(u => u.id === timonelId);

            }
            
            // Verificar auxiliares
            if (auxiliarId || auxiliar2Id) {
                const auxiliaresDuplicados = sesionesEnMismaHora.filter(s => 
                    (auxiliarId && (s.auxiliarId === auxiliarId || s.auxiliar2Id === auxiliarId)) ||
                    (auxiliar2Id && (s.auxiliarId === auxiliar2Id || s.auxiliar2Id === auxiliar2Id))
                );
                
                if (auxiliaresDuplicados.length > 0) {
                    const auxiliares = DB.get('auxiliares') || [];
                    const auxiliarDup = auxiliares.find(a => a.id === auxiliarId || a.id === auxiliar2Id);
                    alert(`⚠️ El auxiliar ${auxiliarDup ? auxiliarDup.nombre : ''} ya está asignado en otra sesión a la misma hora (${horario})`);
                    return;
                }
            }
            
            // Validar barco seleccionado (solo si tipo no es Tierra Y hay participantes)
            const barcoIdValue = document.getElementById('sBarco').value;
            const barcoId = barcoIdValue ? parseInt(barcoIdValue) : null;
            
            if (participantesSesion.length > 0 && tipoSesion !== 'Tierra' && !barcoId) {
                alert('⚠️ Debes seleccionar un barco cuando hay participantes registrados');
                return;
            }

            // Validar que el barco no esté ocupado en la misma fecha y hora (solo si tipo no es Tierra)
            if (tipoSesion !== 'Tierra' && barcoId) {
                const barcoOcupado = sesionesEnMismaHora.find(s => s.barcoId === barcoId);
                
                if (barcoOcupado) {
                    const barcos = DB.get('barcos') || [];
                    const barco = barcos.find(b => b.id === barcoId);
                    alert(`⚠️ El barco "${barco ? barco.nombre : ''}" ya está asignado a otra sesión el ${new Date(fecha).toLocaleDateString('es-ES')} a las ${horario}`);
                    return;
                }
            }
            
            // Detectar cambios en el personal (solo si estamos editando)
            let personalDesasignado = [];
            let sesionAnterior = null;
            
            if (editingSesionId) {
                const data = DB.get('sesiones') || [];
                sesionAnterior = data.find(s => s.id === editingSesionId);
                
                if (sesionAnterior) {
                    // Detectar personal desasignado
                    if (sesionAnterior.timonelId && sesionAnterior.timonelId !== timonelId) {
                        const t = users.find(u => u.id === sesionAnterior.timonelId);
                        if (t && t.telefono) personalDesasignado.push({ persona: t, rol: 'Timonel' });
                    }
                    if (sesionAnterior.timonel2Id && sesionAnterior.timonel2Id !== timonel2Id) {
                        const t2 = users.find(u => u.id === sesionAnterior.timonel2Id);
                        if (t2 && t2.telefono) personalDesasignado.push({ persona: t2, rol: 'Timonel 2' });
                    }
                    if (sesionAnterior.auxiliarId && sesionAnterior.auxiliarId !== auxiliarId) {
                        const a = auxiliares.find(aux => aux.id === sesionAnterior.auxiliarId);
                        if (a && a.telefono) personalDesasignado.push({ persona: a, rol: 'Auxiliar' });
                    }
                    if (sesionAnterior.auxiliar2Id && sesionAnterior.auxiliar2Id !== auxiliar2Id) {
                        const a2 = auxiliares.find(aux => aux.id === sesionAnterior.auxiliar2Id);
                        if (a2 && a2.telefono) personalDesasignado.push({ persona: a2, rol: 'Auxiliar 2' });
                    }
                    if (sesionAnterior.zodiacId && sesionAnterior.zodiacId !== zodiacId) {
                        const z = zodiac.find(zod => zod.id === sesionAnterior.zodiacId);
                        if (z && z.telefono) personalDesasignado.push({ persona: z, rol: 'Zodiac' });
                    }
                }
            }
            
            const sesionData = {
                nombre: document.getElementById('sNombre').value,
                fecha: fecha,

            // Añadir timonel y barco solo si están presentes
            if (timonelId) sesionData.timonelId = timonelId;
            if (barcoId) sesionData.barcoId = barcoId;
            
            // Añadir zodiac si está seleccionado (para todos los tipos)
            if (zodiacId) sesionData.zodiacId = zodiacId;
            
            // Añadir auxiliar si está seleccionado
            if (auxiliarId) sesionData.auxiliarId = auxiliarId;
            
            // Añadir timonel2 y auxiliar2 si están seleccionados
            if (timonel2Id) sesionData.timonel2Id = timonel2Id;
            if (auxiliar2Id) sesionData.auxiliar2Id = auxiliar2Id;
            
            const data = DB.get('sesiones') || [];
            let sesionGuardadaId;
            
            if (editingSesionId) {
                const index = data.findIndex(s => s.id === editingSesionId);
                if (index >= 0) {
                    data[index] = { ...sesionData, id: editingSesionId };
                }
                sesionGuardadaId = editingSesionId;

        window.eliminarSesion = function(id) {
            // Verificar si la sesión tiene asistencia registrada
            const asistencias = DB.get('asistencias') || [];
            const tieneAsistencia = asistencias.some(a => a.sesionId === id);
            
            if (tieneAsistencia) {
                alert('⚠️ No se puede eliminar una sesión con asistencia registrada');
                return;
            }
            
            // Verificar si la sesión está cerrada
            const sesiones = DB.get('sesiones') || [];
            const sesion = sesiones.find(s => s.id === id);
            if (sesion && sesion.cerrada) {
                alert('⚠️ No se puede eliminar una sesión cerrada');
                return;
            }
            
            if (confirm('¿Eliminar esta sesión?\n\nSe eliminarán también todos los eventos asociados en los calendarios.')) {
                const data = DB.get('sesiones') || [];
                DB.set('sesiones', data.filter(s => s.id !== id));
                
                // Eliminar eventos de calendarios
                eliminarEventosCalendario(id);
                
                alert('✅ Sesión eliminada correctamente junto con sus eventos de calendario.');
                render();
            }
        };

        window.mostrarSesionesPasadas = function() {

            // Filtrar sesiones pasadas (anteriores al inicio del día de hoy)

                return fechaHoraSesion < hoyInicio;

                const fechaHoraA = new Date(a.fecha + ' ' + a.horario);
                const fechaHoraB = new Date(b.fecha + ' ' + b.horario);

            } else {

                    </div>
                    <div class="space-y-4">
                        ${sesionesPasadas.map(s => {
                            const timonel = users.find(u => u.id === s.timonelId);
                            const timonel2 = s.timonel2Id ? users.find(u => u.id === s.timonel2Id) : null;
                            const auxiliar = auxiliares.find(a => a.id === s.auxiliarId);
                            const auxiliar2 = s.auxiliar2Id ? auxiliares.find(a => a.id === s.auxiliar2Id) : null;
                            const zodiacPersona = zodiac.find(z => z.id === s.zodiacId);
                            const barco = barcos.find(b => b.id === s.barcoId);
                            const asist = DB.get('asistencias') || [];
                            const tieneAsistencia = asist.some(a => a.sesionId === s.id);
                            const incidencias = DB.get('incidencias') || [];
                            const incidenciasSesion = incidencias.filter(i => i.sesionId === s.id);
                            const tieneCancelacion = incidenciasSesion.some(i => i.tipo === 'cancelacion');

        window.exportarCSV = function() {
            const sesiones = DB.get('sesiones') || [];
            const asistencias = DB.get('asistencias') || [];
            const mes = new Date().toISOString().slice(0, 7);
            const sm = sesiones.filter(s => s.fecha.startsWith(mes));
            
            const rows = [['Fecha', 'Tipo', 'Participantes', 'Asistencias', 'Tasa']];
            
            sm.forEach(s => {
                const asist = asistencias.find(a => a.sesionId === s.id);
                const numAsist = asist ? Object.values(asist.asistencias).filter(a => a).length : 0;
                const tasa = s.participantes.length > 0 ? ((numAsist / s.participantes.length) * 100).toFixed(1) : 0;
                rows.push([s.fecha, s.tipo, s.participantes.length, numAsist, tasa + '%']);
            });
            
            const csv = rows.map(r => r.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `informe_${mes}.csv`;
            a.click();
        };
